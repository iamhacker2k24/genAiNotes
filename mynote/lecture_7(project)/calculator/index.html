<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Calculator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      padding: 20px;
    }

    .calculator {
      background: #1e293b;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4),
        0 0 0 1px rgba(255, 255, 255, 0.08);
      width: 100%;
      max-width: 360px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .display {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 16px;
      padding: 20px;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      overflow: hidden;
      word-break: break-all;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .previous-operand {
      color: #94a3b8;
      font-size: 1.1rem;
      min-height: 1.4rem;
    }

    .current-operand {
      color: #f8fafc;
      font-size: 2.2rem;
      font-weight: 600;
      line-height: 1.2;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 60px;
      border: none;
      border-radius: 14px;
      font-size: 1.25rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:active {
      transform: scale(0.96);
    }

    .btn-number {
      background: #334155;
      color: #f8fafc;
    }

    .btn-number:hover {
      background: #475569;
    }

    .btn-operator {
      background: #3b82f6;
      color: #ffffff;
    }

    .btn-operator:hover {
      background: #2563eb;
    }

    .btn-action {
      background: #475569;
      color: #cbd5e1;
    }

    .btn-action:hover {
      background: #64748b;
    }

    .btn-equals {
      background: #10b981;
      color: #ffffff;
      grid-column: span 2;
    }

    .btn-equals:hover {
      background: #059669;
    }
  </style>
</head>

<body>
  <div class="calculator">
    <div class="display">
      <div class="previous-operand" id="previousOperand"></div>
      <div class="current-operand" id="currentOperand">0</div>
    </div>
    <div class="buttons">
      <button class="btn-action" data-action="clear">AC</button>
      <button class="btn-action" data-action="delete">DEL</button>
      <button class="btn-action" data-action="percent">%</button>
      <button class="btn-operator" data-operator="÷">÷</button>

      <button class="btn-number" data-number="7">7</button>
      <button class="btn-number" data-number="8">8</button>
      <button class="btn-number" data-number="9">9</button>
      <button class="btn-operator" data-operator="×">×</button>

      <button class="btn-number" data-number="4">4</button>
      <button class="btn-number" data-number="5">5</button>
      <button class="btn-number" data-number="6">6</button>
      <button class="btn-operator" data-operator="-">-</button>

      <button class="btn-number" data-number="1">1</button>
      <button class="btn-number" data-number="2">2</button>
      <button class="btn-number" data-number="3">3</button>
      <button class="btn-operator" data-operator="+">+</button>

      <button class="btn-number" data-number="0">0</button>
      <button class="btn-number" data-number=".">.</button>
      <button class="btn-equals" data-action="calculate">=</button>
    </div>
  </div>

  <script>
    class Calculator {
      constructor(prevOperandEl, currOperandEl) {
        this.prevOperandEl = prevOperandEl;
        this.currOperandEl = currOperandEl;
        this.clear();
      }

      clear() {
        this.currentOperand = '0';
        this.previousOperand = '';
        this.operation = undefined;
        this.shouldResetScreen = false;
      }

      delete() {
        if (this.shouldResetScreen) {
          this.clear();
          return;
        }
        if (!this.currentOperand || this.currentOperand === '0') return;
        if (this.currentOperand.length === 1) {
          this.currentOperand = '0';
        } else {
          this.currentOperand = this.currentOperand.slice(0, -1);
        }
      }

      appendNumber(number) {
        if (this.shouldResetScreen) {
          this.currentOperand = '0';
          this.shouldResetScreen = false;
        }
        if (number === '.' && this.currentOperand.includes('.')) return;
        if (this.currentOperand === '' && number === '.') {
          this.currentOperand = '0.';
          return;
        }
        if (this.currentOperand === '0' && number !== '.') {
          this.currentOperand = number;
        } else {
          this.currentOperand += number;
        }
      }

      chooseOperation(operation) {
        if (this.currentOperand === '' && this.previousOperand === '') return;

        if (this.currentOperand === '') {
          this.operation = operation;
          return;
        }

        if (this.previousOperand !== '') {
          this.compute();
        }

        this.operation = operation;
        this.previousOperand = this.currentOperand;
        this.currentOperand = '';
      }

      percent() {
        const current = parseFloat(this.currentOperand);
        if (isNaN(current)) return;
        this.currentOperand = (current / 100).toString();
        this.shouldResetScreen = true;
      }

      compute() {
        let computation;
        const prev = parseFloat(this.previousOperand);
        const current = parseFloat(this.currentOperand);
        if (isNaN(prev) || isNaN(current)) return;

        switch (this.operation) {
          case '+':
            computation = prev + current;
            break;
          case '-':
            computation = prev - current;
            break;
          case '×':
          case '*':
            computation = prev * current;
            break;
          case '÷':
          case '/':
            if (current === 0) {
              alert("Cannot divide by zero");
              return;
            }
            computation = prev / current;
            break;
          default:
            return;
        }

        this.currentOperand = parseFloat(computation.toFixed(10)).toString();
        this.operation = undefined;
        this.previousOperand = '';
        this.shouldResetScreen = true;
      }

      updateDisplay() {
        this.currOperandEl.innerText = this.currentOperand || '0';
        if (this.operation != null) {
          this.prevOperandEl.innerText = `${this.previousOperand} ${this.operation}`;
        } else {
          this.prevOperandEl.innerText = '';
        }
      }
    }

    const prevOperandEl = document.getElementById('previousOperand');
    const currOperandEl = document.getElementById('currentOperand');
    const calculator = new Calculator(prevOperandEl, currOperandEl);

    document.querySelectorAll('[data-number]').forEach(button => {
      button.addEventListener('click', () => {
        calculator.appendNumber(button.dataset.number);
        calculator.updateDisplay();
      });
    });

    document.querySelectorAll('[data-operator]').forEach(button => {
      button.addEventListener('click', () => {
        calculator.chooseOperation(button.dataset.operator);
        calculator.updateDisplay();
      });
    });

    document.querySelectorAll('[data-action]').forEach(button => {
      button.addEventListener('click', () => {
        const action = button.dataset.action;
        if (action === 'clear') {
          calculator.clear();
        } else if (action === 'delete') {
          calculator.delete();
        } else if (action === 'percent') {
          calculator.percent();
        } else if (action === 'calculate') {
          calculator.compute();
        }
        calculator.updateDisplay();
      });
    });

    // Keyboard support
    window.addEventListener('keydown', (e) => {
      if ((e.key >= '0' && e.key <= '9') || e.key === '.') {
        calculator.appendNumber(e.key);
      } else if (e.key === '+' || e.key === '-') {
        calculator.chooseOperation(e.key);
      } else if (e.key === '*') {
        calculator.chooseOperation('×');
      } else if (e.key === '/') {
        e.preventDefault();
        calculator.chooseOperation('÷');
      } else if (e.key === 'Enter' || e.key === '=') {
        e.preventDefault();
        calculator.compute();
      } else if (e.key === 'Backspace') {
        calculator.delete();
      } else if (e.key === 'Escape') {
        calculator.clear();
      } else if (e.key === '%') {
        calculator.percent();
      }
      calculator.updateDisplay();
    });
  </script>
</body>

</html>
